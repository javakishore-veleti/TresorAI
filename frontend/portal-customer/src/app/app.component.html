<div class="min-h-screen flex flex-col">
  <!-- Top bar -->
  <header class="bg-surface-elevated border-b border-sand">
    <div class="max-w-7xl mx-auto px-6 py-4 flex items-center gap-8">
      <a routerLink="/stream" class="flex items-center gap-3 group">
        <img
          src="assets/favicons/icon-192.png"
          alt="TrésorAI"
          class="size-9 rounded-tai-sm shadow-tai-card"
        />
        <span class="font-semibold text-lg text-forest tracking-tight">
          Trésor<span class="text-brand-emerald-700">AI</span>
        </span>
      </a>

      <nav class="flex items-center gap-1 ml-4 flex-1">
        @for (item of navItems; track item.path) {
          <a
            [routerLink]="item.path"
            routerLinkActive="bg-surface-cream text-forest"
            #rla="routerLinkActive"
            class="px-3 py-2 rounded-tai-sm text-sm font-medium transition-colors"
            [class.text-bronze]="!rla.isActive"
            [class.hover:text-forest]="!rla.isActive"
            [class.hover:bg-surface-cream]="!rla.isActive"
          >
            {{ item.label }}
          </a>
        }
      </nav>

      <div class="flex items-center gap-3 text-sm text-bronze">
        <span class="hidden md:inline">Sarah Chen · CFO @ Acme SMB</span>
        <span class="size-8 rounded-full bg-brand-emerald-700 text-surface-pearl flex items-center justify-center font-semibold text-xs">SC</span>
      </div>
    </div>
  </header>

  <main class="flex-1 max-w-7xl mx-auto w-full px-6 py-8">
    <router-outlet />
  </main>

  <footer class="border-t border-sand bg-surface-elevated">
    <div class="max-w-7xl mx-auto px-6 py-4 text-xs text-bronze flex items-center justify-between">
      <span>TrésorAI · agentic treasury & AP-fraud copilot for SMBs</span>
      <span class="font-mono">v0.0.1</span>
    </div>
  </footer>

  <tai-toast-host />
</div>
