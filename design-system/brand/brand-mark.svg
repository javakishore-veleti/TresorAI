<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 512 512" fill="none" role="img" aria-label="TrésorAI mark">
  <!-- Rounded emerald square: brand surface -->
  <rect width="512" height="512" rx="96" fill="#047857"/>

  <!-- Subtle inner glow for depth -->
  <rect x="16" y="16" width="480" height="480" rx="80" fill="none" stroke="#10B981" stroke-opacity="0.35" stroke-width="2"/>

  <!-- Pearl 'T' (the treasure-vault wordmark) -->
  <path d="M120 168 H392 V232 H296 V392 H216 V232 H120 Z" fill="#FAFAF6"/>

  <!-- Champagne-gold gem above the T (the 'treasure') -->
  <g>
    <path d="M256 64 L296 112 L256 160 L216 112 Z" fill="#D4A574"/>
    <!-- subtle highlight on the gem -->
    <path d="M256 64 L276 88 L256 112 L236 88 Z" fill="#E8C896" fill-opacity="0.85"/>
  </g>
</svg>
