<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 512 512" fill="none" role="img" aria-label="TrésorAI Admin mark">
  <!-- Rounded emerald square: brand surface -->
  <rect width="512" height="512" rx="96" fill="#047857"/>

  <!-- Subtle inner glow for depth -->
  <rect x="16" y="16" width="480" height="480" rx="80" fill="none" stroke="#10B981" stroke-opacity="0.35" stroke-width="2"/>

  <!-- Pearl 'T' -->
  <path d="M120 168 H392 V232 H296 V392 H216 V232 H120 Z" fill="#FAFAF6"/>

  <!-- Champagne-gold gem above the T -->
  <g>
    <path d="M256 64 L296 112 L256 160 L216 112 Z" fill="#D4A574"/>
    <path d="M256 64 L276 88 L256 112 L236 88 Z" fill="#E8C896" fill-opacity="0.85"/>
  </g>

  <!-- Mauve admin badge (lower-right): shield with 'A' -->
  <g>
    <circle cx="408" cy="408" r="64" fill="#5B21B6"/>
    <circle cx="408" cy="408" r="60" fill="none" stroke="#FAFAF6" stroke-opacity="0.55" stroke-width="2"/>
    <!-- 'A' glyph inside the badge -->
    <path d="M388 432 L408 380 L428 432 M395 418 H421" stroke="#FAFAF6" stroke-width="6" stroke-linecap="round" stroke-linejoin="round" fill="none"/>
  </g>
</svg>
