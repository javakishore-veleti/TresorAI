services:
  postgres:
    image: pgvector/pgvector:pg16
    container_name: tresorai-postgres
    restart: unless-stopped
    environment:
      POSTGRES_USER: tresorai
      POSTGRES_PASSWORD: tresorai
      POSTGRES_DB: tresorai
    ports:
      - "5432:5432"
    volumes:
      - tresorai_pg_data:/var/lib/postgresql/data
      - ./init.sql:/docker-entrypoint-initdb.d/01-init.sql:ro
    healthcheck:
      test: ["CMD-SHELL", "pg_isready -U tresorai -d tresorai"]
      interval: 5s
      timeout: 5s
      retries: 10

volumes:
  tresorai_pg_data:
    name: tresorai_pg_data
