# Apache Airflow 2.10 — local LocalExecutor stack.
# Per ADR-0012: orchestrator for all three AI/ML tracks (Classical / DL / GenAI)
# plus Initial Downloads. Image is already cached locally (apache/airflow:2.10.0-python3.12).
#
# 4 containers:
#   tresorai-airflow-postgres  — Airflow metadata DB (separate from app Postgres)
#   tresorai-airflow-init      — runs once: db migrate + create admin user
#   tresorai-airflow-scheduler — runs DAGs (LocalExecutor, no Celery worker needed)
#   tresorai-airflow-webserver — UI + REST API on host port 8088 (container 8080)
#
# Web UI:    http://localhost:8088    (admin / admin)
# REST API:  http://localhost:8088/api/v1/
# DAGs:      ./dags/  (mounted into the scheduler + webserver)

x-airflow-common: &airflow-common
  image: apache/airflow:2.10.0-python3.12
  environment: &airflow-env
    AIRFLOW__CORE__EXECUTOR: LocalExecutor
    AIRFLOW__DATABASE__SQL_ALCHEMY_CONN: postgresql+psycopg2://airflow:airflow@postgres/airflow
    AIRFLOW__CORE__LOAD_EXAMPLES: "false"
    # Setup DAGs are admin-portal-triggered, not scheduled — keep new DAGs
    # paused on first parse so a restart doesn't auto-fire historical runs.
    AIRFLOW__CORE__DAGS_ARE_PAUSED_AT_CREATION: "true"
    # Disable safe_mode keyword filter — our DAG factory pattern hides the
    # literal 'airflow'/'DAG' strings in shared/idempotent_dag.py, so per-DAG
    # files don't trip the discovery filter.
    AIRFLOW__CORE__DAG_DISCOVERY_SAFE_MODE: "false"
    AIRFLOW__CORE__FERNET_KEY: "tresorai-dev-fernet-not-for-prod-32b="
    AIRFLOW__WEBSERVER__SECRET_KEY: "tresorai-dev-webserver-not-for-prod"
    AIRFLOW__WEBSERVER__EXPOSE_CONFIG: "true"
    AIRFLOW__API__AUTH_BACKENDS: "airflow.api.auth.backend.basic_auth,airflow.api.auth.backend.session"
    # Make admin-api callbacks reachable from inside the airflow container
    TAI_ADMIN_API_URL: "http://host.docker.internal:8091"
  volumes:
    # DAGs + plugins live at REPO ROOT (../../../airflow/) — production-deployable.
    # GitHub Actions syncs them to Cloud Composer's GCS bucket. ADR-0012 + ADR-0016.
    - ../../../airflow/dags:/opt/airflow/dags
    - ../../../airflow/plugins:/opt/airflow/plugins
    # Logs are local-only (not deployed)
    - ./logs:/opt/airflow/logs
  user: "${AIRFLOW_UID:-50000}:0"
  depends_on:
    postgres:
      condition: service_healthy

services:
  postgres:
    image: postgres:16-alpine
    container_name: tresorai-airflow-postgres
    restart: unless-stopped
    environment:
      POSTGRES_USER: airflow
      POSTGRES_PASSWORD: airflow
      POSTGRES_DB: airflow
    volumes:
      - tresorai_airflow_pg:/var/lib/postgresql/data
    healthcheck:
      test: ["CMD", "pg_isready", "-U", "airflow"]
      interval: 5s
      timeout: 5s
      retries: 10

  airflow-init:
    <<: *airflow-common
    container_name: tresorai-airflow-init
    entrypoint: /bin/bash
    command:
      - -c
      - |
        set -e
        airflow db migrate
        airflow users create \
          --username admin --password admin \
          --firstname Admin --lastname User \
          --role Admin --email admin@tresorai.local 2>/dev/null || \
          echo "admin user already exists, skipping"

  airflow-scheduler:
    <<: *airflow-common
    container_name: tresorai-airflow-scheduler
    restart: unless-stopped
    command: scheduler
    depends_on:
      airflow-init:
        condition: service_completed_successfully
    healthcheck:
      test:
        - CMD-SHELL
        - 'airflow jobs check --job-type SchedulerJob --hostname "$${HOSTNAME}"'
      interval: 30s
      timeout: 10s
      retries: 5
      start_period: 30s

  airflow-webserver:
    <<: *airflow-common
    container_name: tresorai-airflow-webserver
    restart: unless-stopped
    command: webserver
    ports:
      - "8088:8080"
    depends_on:
      airflow-init:
        condition: service_completed_successfully
    healthcheck:
      test: ["CMD", "curl", "--fail", "http://localhost:8080/health"]
      interval: 30s
      timeout: 10s
      retries: 5
      start_period: 30s

volumes:
  tresorai_airflow_pg:
    name: tresorai_airflow_pg
