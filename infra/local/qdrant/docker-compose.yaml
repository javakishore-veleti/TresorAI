# Qdrant — alternate vector DB. NOT enabled by default (pgvector is primary per ADR-003).
# Pinned to v1.11.0 — image already present locally.
# Enable by uncommenting `qdrant` in infra/local/docker-all-{up,down,status}.sh.
services:
  qdrant:
    image: qdrant/qdrant:v1.11.0
    container_name: tresorai-qdrant
    restart: unless-stopped
    ports:
      - "6333:6333"   # REST API
      - "6334:6334"   # gRPC API
    volumes:
      - tresorai_qdrant_data:/qdrant/storage

volumes:
  tresorai_qdrant_data:
    name: tresorai_qdrant_data
